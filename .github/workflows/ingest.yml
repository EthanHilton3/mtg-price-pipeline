name: ingest

on:
  schedule:
    # Hourly at :17. MTGJSON publishes once a day (~06:15 UTC), but polling hourly
    # means a skipped or delayed GitHub run costs us an hour, not a day.
    # :17 instead of :00 because GitHub's scheduler is most congested on the hour.
    - cron: "17 * * * *"
  workflow_dispatch: {}   # "Run workflow" button for manual runs and demos

# Never let two runs merge at the same time (e.g. a slow backfill overlapping
# the next hourly run). The MERGE is idempotent, but there's no reason to race.
concurrency:
  group: ingest
  cancel-in-progress: false

# Least privilege: read the repo, publish to Pages, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MTG_DB: md:mtg
      motherduck_token: ${{ secrets.MOTHERDUCK_TOKEN }}   # GitHub secret, never in the repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest (skip / daily / backfill)
        run: python -m pipeline.ingest
      - name: Healthcheck (fails if data is stale)
        if: always()
        run: python -m pipeline.healthcheck
      # Build the status page even when a step above failed, so failures show up on it.
      - name: Build status page
        if: always()
        run: python -m pipeline.status_page
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site

  publish:
    needs: ingest
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
